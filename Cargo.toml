[package]
name = "blocknames"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A local TON vanity wallet CLI with CPU and CUDA backends"
license = "MIT"
repository = "https://github.com/ProDALOR/blocknames"
readme = "README.md"
authors = ["ProDALOR"]
keywords = ["ton", "vanity", "wallet", "cuda", "cli"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
include = ["/src/**", "/build.rs", "/build/**", "/tests/**", "/examples/**", "/docs/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bip39 = { version = "2", default-features = false, features = ["std", "zeroize"] }
clap = { version = "4", features = ["derive"] }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"] }
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
ctrlc = "3"
libloading = "0.9"

[build-dependencies]
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"

[dev-dependencies]
num-bigint = "0.4"
num-traits = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
