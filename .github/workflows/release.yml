name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check tag matches Cargo version
        run: |
          $metadata = cargo +stable metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $metadata.packages[0].version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag must match Cargo.toml version' }
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked --release
      - run: cargo +stable run --locked --release --example generate_ed25519_table -- --check
      - run: cargo +stable build --locked --release
      - name: Package executable and documentation
        run: |
          $name = "blocknames-$env:RELEASE_TAG-windows-x86_64"
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item -LiteralPath target/release/blocknames.exe -Destination "dist/$name.exe"
          Copy-Item -LiteralPath target/release/blocknames.exe -Destination dist/stage/blocknames.exe
          Copy-Item -LiteralPath README.md,LICENSE,THIRD_PARTY_NOTICES -Destination dist/stage
          Copy-Item -LiteralPath docs -Destination dist/stage/docs -Recurse
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/$name.zip"
          $assets = @(Get-ChildItem dist -File)
          $checksums = foreach ($file in $assets) { "{0}  {1}" -f (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $file.Name }
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS'), ($checksums -join "`n") + "`n")
      - name: Retain build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "blocknames $env:RELEASE_TAG" --generate-notes
