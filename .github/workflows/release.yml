name: Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, for example v0.1.2
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    # A version bump is published only by an explicit "Release vX.Y.Z" commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      startsWith(github.event.head_commit.message, 'Release v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Resolve and validate release version
        run: |
          $metadata = cargo +stable metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $metadata.packages[0].version
          if (-not $env:RELEASE_TAG) {
            $env:RELEASE_TAG = "v$version"
            if ($env:RELEASE_COMMIT_MESSAGE.Split("`n")[0].Trim() -ne "Release v$version") {
              throw 'Release commit title must exactly match the Cargo version'
            }
            "RELEASE_TAG=$env:RELEASE_TAG" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag must match Cargo.toml version' }
          $tagRefs = @(git ls-remote origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tagRefs.Count -gt 0) {
            $peeled = @($tagRefs | Where-Object { $_.EndsWith('^{}') })
            $target = if ($peeled.Count -gt 0) { $peeled[0] } else { $tagRefs[0] }
            $head = git rev-parse HEAD
            if (($target -split '\s+')[0] -ne $head) { throw 'Existing release tag points to a different commit' }
          } elseif ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Tag or manual releases require an existing tag'
          }
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked --release
      - run: cargo +stable run --locked --release --example generate_ed25519_table -- --check
      - run: cargo +stable build --locked --release
      - name: Bundle pinned NVIDIA NVRTC runtime and license
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nvrtc.zip'
          if (-not (Test-Path -LiteralPath $archive)) {
            Invoke-WebRequest -Uri 'https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-13.0.88-archive.zip' -OutFile $archive -TimeoutSec 180
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8c50a52467826167e0dbe99936140c52d62272bfc5849fe2d6587d050c8c5d29') {
            throw 'NVIDIA NVRTC archive checksum mismatch'
          }
          New-Item -ItemType Directory -Force dist/stage/cuda | Out-Null
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $root = 'cuda_nvrtc-windows-x86_64-13.0.88-archive'
            $files = @{
              "$root/bin/x64/nvrtc64_130_0.dll" = 'nvrtc64_130_0.dll'
              "$root/bin/x64/nvrtc-builtins64_130.dll" = 'nvrtc-builtins64_130.dll'
              "$root/LICENSE" = 'LICENSE.NVIDIA.txt'
            }
            foreach ($source in $files.Keys) {
              $entry = $zip.GetEntry($source)
              if ($null -eq $entry) { throw "NVIDIA archive entry missing: $source" }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $PWD "dist/stage/cuda/$($files[$source])"))
            }
          } finally { $zip.Dispose() }
      - name: Package executable and documentation
        run: |
          $name = "blocknames-$env:RELEASE_TAG-windows-x86_64"
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item -LiteralPath target/release/blocknames.exe -Destination "dist/$name.exe"
          Copy-Item -LiteralPath target/release/blocknames.exe -Destination dist/stage/blocknames.exe
          Copy-Item -LiteralPath README.md,LICENSE,THIRD_PARTY_NOTICES -Destination dist/stage
          Copy-Item -LiteralPath docs -Destination dist/stage/docs -Recurse
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/$name.zip"
          $assets = @(Get-ChildItem dist -File)
          $checksums = foreach ($file in $assets) { "{0}  {1}" -f (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $file.Name }
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS'), ($checksums -join "`n") + "`n")
      - name: Verify packaged runtime loads without an external CUDA installation
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'blocknames-smoke-appdata'
          $env:CUDA_PATH = $null
          $env:CUDA_HOME = $null
          $report = & ./dist/stage/blocknames.exe bench --mode bip39-12 --seconds 1 --batch-size 16 --threads 2 --quiet --format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = [IO.Path]::GetFullPath((Join-Path $PWD 'dist/stage/cuda/nvrtc64_130_0.dll'))
          $actual = $report.cuda_runtime_library -replace '^\\\\\?\\', ''
          if ($actual -ne $expected) { throw "Packaged NVRTC did not load: $actual" }
          # Hosted runners need no NVIDIA GPU; CUDA discovery must still load our DLL.
      - name: Retain build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          $options = @('--target', $env:GITHUB_SHA, '--title', "blocknames $env:RELEASE_TAG")
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -or $env:GITHUB_REF.StartsWith('refs/tags/')) {
            $options += '--verify-tag'
          }
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (Test-Path -LiteralPath $notes) { $options += @('--notes-file', $notes) }
          else { $options += '--generate-notes' }
          gh release create $env:RELEASE_TAG @assets @options
