name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked --release
      - name: Verify the public Ed25519 table independently
        run: cargo +stable run --locked --release --example generate_ed25519_table -- --check
      - run: cargo +stable build --locked --release
      - name: CPU CLI smoke test (no CUDA required)
        run: cargo +stable run --locked --release -- bench --backend cpu --mode bip39-12 --seconds 1 --batch-size 16 --threads 2 --quiet --format json
